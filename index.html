<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECEPTOR SISMOS MP</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body {
    background: #050b14;
    color: white;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    transition: .3s;
}
/* ESTADO */
.status {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,.08);
    padding: 16px 20px;
    border-radius: 22px;
    backdrop-filter: blur(10px);
}
.status-left {
    display: flex;
    align-items: center;
    gap: 12px;
}
.wifi {
    font-size: 28px;
    animation: pulse 1s infinite;
}
.online {
    display: flex;
    flex-direction: column;
}
.online strong {
    font-size: 16px;
}
.online span {
    font-size: 12px;
    opacity: 0.7;
}
.dot {
    width: 10px;
    height: 10px;
    background: #00ff84;
    border-radius: 50%;
    margin-left: 10px;
    animation: pulse 1s infinite;
}
@keyframes pulse {
    50% {
        transform: scale(1.5);
        opacity: 0.5;
    }
}
/* RELOJ */
.reloj {
    font-size: 95px;
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 0 25px rgba(255,255,255,.2);
}
.fecha {
    margin-top: 15px;
    font-size: 18px;
    opacity: 0.8;
    text-transform: capitalize;
}
.info {
    position: absolute;
    bottom: 18px;
    font-size: 12px;
    opacity: 0.5;
    letter-spacing: 1px;
}

/* NUEVO DISEÑO ALERTA FUERTE */
.alerta {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ff0000; /* Rojo intenso continuo */
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999999;
    text-align: center;
    padding: 25px;
}
.alerta.active {
    display: flex;
}
.alerta h1 {
    font-size: 75px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: 2px;
    color: #ffffff;
    text-transform: uppercase;
    /* Animación de parpadeo */
    animation: parpadeoTexto 0.9s infinite;
}
/* Animación para que las letras de Alerta Sísmica parpadeen */
@keyframes parpadeoTexto {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
}
.alerta p {
    font-size: 24px;
    max-width: 700px;
    margin-top: 10px;
    opacity: 0.9;
    display: none; /* Se oculta para preservar el estilo limpio de la imagen, pero sigue disponible en el código */
}
.alerta-fecha {
    font-size: 32px;
    font-weight: bold;
    color: white;
    margin-top: 40px;
    letter-spacing: 1px;
}
.btnCerrar {
    margin-top: 50px;
    padding: 16px 55px;
    border: 2px solid white;
    border-radius: 50px; /* Estilo píldora/ovalado */
    background: transparent;
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: background 0.2s;
}
.btnCerrar:hover {
    background: rgba(255, 255, 255, 0.1);
}
.alerta-footer {
    position: absolute;
    bottom: 25px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: bold;
    opacity: 0.8;
    color: white;
}

/* ALERTA DÉBIL */
.toast {
    position: fixed;
    top: 20px;
    left: 20px;
    right: 20px;
    background: #ffcc00;
    color: #111;
    padding: 18px;
    border-radius: 22px;
    display: none;
    z-index: 999999;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    animation: slide .3s;
}
.toast.active {
    display: block;
}
.toast h3 {
    font-size: 20px;
    margin-bottom: 8px;
}
.toast p {
    font-size: 15px;
    line-height: 1.5;
}
@keyframes slide {
    from {
        transform: translateY(-100px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}
</style>
</head>
<body>

<div class="status">
    <div class="status-left">
        <div class="wifi">📶</div>
        <div class="online">
            <strong>CONECTADO</strong>
            <span>Recibiendo datos en tiempo real</span>
        </div>
        <div class="dot"></div>
    </div>
    <div>SISMOS MP</div>
</div>

<div class="reloj" id="reloj">00:00:00</div>
<div class="fecha" id="fecha">Cargando fecha...</div>
<div class="info">SISMOS MP APP PAGINA RECEPTORA DE ALERTA SISMICA</div>

<div class="alerta" id="alerta">
    <h1 id="tituloAlerta">ALERTA<br>SÍSMICA</h1>
    <p id="mensajeAlerta">Sismo detectado</p>
    
    <div class="alerta-fecha" id="alertaFechaHora">--/--/---- --:--:--</div>
    
    <button class="btnCerrar" onclick="detenerTodo()">CERRAR / SILENCIAR</button>
    
    <div class="alerta-footer">SISMOS MP APP DE MÉXICO | RECEPTOR EN TIEMPO REAL</div>
</div>

<div class="toast" id="toast">
    <h3 id="tituloToast">🟡 Movimiento detectado</h3>
    <p id="mensajeToast">Información del evento</p>
</div>

<audio id="audioFuerte" preload="auto" loop>
    <source src="https://raw.githubusercontent.com/sismosmp1/sismosmp-audio1/main/sirena_1min.mp3" type="audio/mpeg">
</audio>

<audio id="audioDebil" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/952/952-preview.mp3" type="audio/mpeg">
</audio>

<audio id="audioEmergencia" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyC6-l7pOmp6Pe374UqzvopTA_rtXZHv_78",
    authDomain: "sismos-mp.firebaseapp.com",
    databaseURL: "https://sismos-mp-default-rtdb.firebaseio.com",
    projectId: "sismos-mp",
    storageBucket: "sismos-mp.firebasestorage.app",
    messagingSenderId: "457482276777",
    appId: "1:457482276777:web:59907aef1e13b3c7f0beb8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* RELOJ PANTALLA PRINCIPAL */
function actualizarReloj() {
    let ahora = new Date();
    let hora = ahora.toLocaleTimeString('es-MX');
    let fecha = ahora.toLocaleDateString('es-MX', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });
    document.getElementById("reloj").innerHTML = hora;
    document.getElementById("fecha").innerHTML = fecha;
}
setInterval(actualizarReloj, 1000);
actualizarReloj();

/* SINTETIZADOR DE VOZ */
function hablar(texto) {
    speechSynthesis.cancel();
    let voz = new SpeechSynthesisUtterance(texto);
    voz.lang = "es-MX";
    voz.rate = .95;
    voz.pitch = 1;
    speechSynthesis.speak(voz);
}

/* FUNCIÓN MOSTRAR ALERTA (CON DETECCIÓN DE HORA Y FECHA EXACTA EN EL ESPACIO VACÍO) */
function mostrarAlerta(datos) {
    let alerta = document.getElementById("alerta");
    
    // Configurar la Fecha y Hora Exacta en la que se recibe el sismo
    let ahora = new Date();
    let dia = String(ahora.getDate()).padStart(2, '0');
    let mes = String(ahora.getMonth() + 1).padStart(2, '0');
    let anio = ahora.getFullYear();
    
    let opcionesHora = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
    let horaFormateada = ahora.toLocaleTimeString('es-MX', opcionesHora).toLowerCase();
    
    // Coloca el formato exacto en el contenedor: DD/MM/AAAA hh:mm:ss p.m.
    document.getElementById("alertaFechaHora").innerHTML = `${dia}/${mes}/${anio} ${horaFormateada}`;
    
    // Mantenemos la actualización de textos por si mandas variables desde Firebase
    document.getElementById("mensajeAlerta").innerHTML = datos.mensaje || "Sismo detectado";
    alerta.classList.add("active");
    
    /* PANTALLA COMPLETA */
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }
    
    /* VIBRACIÓN */
    navigator.vibrate([1000, 300, 1000, 300, 1000, 300, 1000]);
    
    /* SONIDO FUERTE */
    let audio = document.getElementById("audioFuerte");
    audio.currentTime = 0;
    audio.volume = 1;
    audio.play();
    
    /* VOZ */
    hablar(datos.mensaje || "Alerta sísmica activada");
}

/* ALERTA DÉBIL */
function mostrarDebil(datos) {
    let toast = document.getElementById("toast");
    document.getElementById("tituloToast").innerHTML = datos.titulo || "🟡 Movimiento detectado";
    document.getElementById("mensajeToast").innerHTML = datos.mensaje || "Movimiento leve detectado";
    toast.classList.add("active");
    
    navigator.vibrate([200, 100, 200]);
    
    let audio = document.getElementById("audioDebil");
    audio.currentTime = 0;
    audio.volume = .5;
    audio.play();
    
    hablar(datos.mensaje || "Movimiento leve detectado");
    
    setTimeout(() => {
        toast.classList.remove("active");
    }, 7000);
}

/* EMERGENCIA */
function mostrarEmergencia(datos) {
    let alerta = document.getElementById("alerta");
    alerta.style.background = "#ff9800";
    
    document.getElementById("tituloAlerta").innerHTML = datos.titulo || "⚠️ EMERGENCIA";
    document.getElementById("mensajeAlerta").innerHTML = datos.mensaje || "Emergencia detectada";
    alerta.classList.add("active");
    
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }
    
    navigator.vibrate([700, 200, 700, 200, 700]);
    
    let audio = document.getElementById("audioEmergencia");
    audio.currentTime = 0;
    audio.volume = .9;
    audio.play();
    
    hablar(datos.mensaje || "Emergencia activada");
}

/* DETENER ALERTAS */
function detenerTodo() {
    document.getElementById("alerta").classList.remove("active");
    
    /* Restaurar comportamiento inicial */
    document.getElementById("tituloAlerta").innerHTML = "ALERTA<br>SÍSMICA";
    document.getElementById("alerta").style.background = "#ff0000";
    
    /* PAUSAR AUDIOS */
    document.getElementById("audioFuerte").pause();
    document.getElementById("audioDebil").pause();
    document.getElementById("audioEmergencia").pause();
    
    /* DETENER VIBRACIÓN Y VOZ */
    navigator.vibrate(0);
    speechSynthesis.cancel();
}

/* ESCUCHAR FIREBASE CORRECCIONES EN TIEMPO REAL */
db.ref("alerta").on("value", (snap) => {
    let data = snap.val();
    if (!data) return;
    console.log(data);
    
    if (data.tipo === "fuerte") {
        mostrarAlerta(data);
    }
    if (data.tipo === "debil") {
        mostrarDebil(data);
    }
    if (data.tipo === "emergencia") {
        mostrarEmergencia(data);
    }
    if (data.tipo === "stop") {
        detenerTodo();
    }
});
</script>
</body>
</html>
